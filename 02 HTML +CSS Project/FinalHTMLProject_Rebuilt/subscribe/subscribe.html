<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>اشترك الآن</title>
</head>
<body>
   <header>
    <h1>اشترك في المنصة</h1>
    <nav>
        <a href="../settings/settings.html">السابق</a>
        <a href="../index/index.html">الصفحة الرئيسية</a>
        <a href="../contact/contact.html">التالي</a>
    </nav>
</header>

    <main>
        <section>
            <h2>الخطة الاحترافية</h2>
            <ul>
                <li>الوصول إلى جميع الدورات</li>
                <li>شهادات إتمام معتمدة</li>
                <li>دعم فني مستمر</li>
            </ul>
        </section>

        <!-- نموذج الاشتراك والدفع -->
        <section>
            <h2>بيانات الاشتراك</h2>
            <form>
                <label for="subscriber-name">الاسم الكامل:</label>
                <input type="text" id="subscriber-name" name="name" placeholder="مثال: أحمد علي" required>
                <label for="subscriber-email">البريد الإلكتروني:</label>
                <input type="email" id="subscriber-email" name="email" placeholder="you@example.com" required>
                <label for="card-number">رقم البطاقة:</label>
                <input type="text" id="card-number" name="card-number" pattern="[0-9]{16}" minlength="16" placeholder="16 رقمًا" required>
                <label for="expiry-date">تاريخ الانتهاء:</label>
                <input type="month" id="expiry-date" name="expiry-date" required>
                <label for="cvv">رمز CVV:</label>
                <input type="password" id="cvv" name="cvv" pattern="[0-9]{3}" minlength="3" placeholder="3 أرقام" required>
                <button type="submit">تأكيد الاشتراك</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 الاشتراك في المنصة</p>
    </footer>
</body>
</html>
