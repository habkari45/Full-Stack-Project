<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="منصة عربية لتعلم تطوير الويب باستخدام HTML وCSS وBootstrap">
  <title>الإعدادات</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="site-header py-4 shadow-sm">
  <div class="container">
    <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
      <div>
        <h1 class="brand-title h3 mb-1">أكاديمية الويب الحديثة</h1>
        <p class="mb-0 opacity-75">تعلم • طبّق • طوّر مهاراتك</p>
      </div>
      <nav class="nav nav-pills justify-content-center flex-wrap">
        <a class="nav-link" href="../index/index.html">الرئيسية</a>
<a class="nav-link" href="../courses/courses.html">الدورات</a>
<a class="nav-link" href="../dashboard/dashboard.html">لوحة التحكم</a>
<a class="nav-link" href="../profile/profile.html">الملف الشخصي</a>
<a class="nav-link active" href="../settings/settings.html">الإعدادات</a>
<a class="nav-link" href="../subscribe/subscribe.html">الاشتراك</a>
<a class="nav-link" href="../search/search.html">البحث</a>
<a class="nav-link" href="../contact/contact.html">تواصل معنا</a>
      </nav>
    </div>
  </div>
</header>
<main class="container py-5">

<div class="row g-4">
  <aside class="col-lg-4">
    <div class="list-group section-card overflow-hidden">
      <a class="list-group-item list-group-item-action active" href="#general">الإعدادات العامة</a>
      <a class="list-group-item list-group-item-action" href="#notifications">الإشعارات</a>
      <a class="list-group-item list-group-item-action" href="#appearance">المظهر</a>
      <a class="list-group-item list-group-item-action disabled" href="#">إعدادات متقدمة</a>
    </div>
  </aside>
  <section class="col-lg-8">
    <div class="card section-card">
      <div class="card-header py-3">تفضيلات المستخدم</div>
      <div class="card-body">
        <form>
          <div class="mb-4" id="general">
            <label class="form-label" for="language">اللغة المفضلة</label>
            <select class="form-select" id="language"><option>العربية</option><option>English</option></select>
          </div>
          <div class="mb-4" id="notifications">
            <h3 class="h6">الإشعارات</h3>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="mail" checked><label class="form-check-label" for="mail">إشعارات البريد</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="courses" checked><label class="form-check-label" for="courses">تحديثات الدورات</label></div>
          </div>
          <div class="mb-4" id="appearance">
            <h3 class="h6">المظهر</h3>
            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="theme" id="light" checked><label class="form-check-label" for="light">فاتح</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="theme" id="dark"><label class="form-check-label" for="dark">داكن</label></div>
          </div>
          <button class="btn btn-brand" type="submit">حفظ الإعدادات</button>
        </form>
      </div>
    </div>
  </section>
</div>

</main>
<footer class="py-4 mt-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 text-center text-md-start">
    <span>© 2026 منصة تطوير الويب</span>
    <span>أكاديمية الويب الحديثة</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
