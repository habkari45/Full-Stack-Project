<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quiz</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-4" style="max-width: 480px;">

  <a href="../index.html" class="mb-3 d-inline-block">← Back</a>

    <h2>Quiz</h2>

    <p class="text-secondary">3 easy questions</p>

    <div class="mb-3">
      <label class="form-label">1) 5 + 3 = ?</label>

      <select id="q1" class="form-select">
        <option value="">Choose answer</option>
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="10">10</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">2) HTML file ends with?</label>

      <select id="q2" class="form-select">
        <option value="">Choose answer</option>
        <option value=".css">.css</option>
        <option value=".html">.html</option>
        <option value=".js">.js</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">3) 12 / 3 = ?</label>

      <select id="q3" class="form-select">
        <option value="">Choose answer</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="6">6</option>
      </select>
    </div>

    <button id="btn" class="btn btn-primary">
      Check score
    </button>

    <div id="out" class="alert alert-info mt-3 d-none"></div>

  </div>


  <script>

    document.getElementById("btn").onclick = function () {

      var q1 = document.getElementById("q1").value;
      var q2 = document.getElementById("q2").value;
      var q3 = document.getElementById("q3").value;

      var score = 0;

      if (q1 == "8")
        score = score + 1;

      if (q2 == ".html")
        score = score + 1;

      if (q3 == "4")
        score = score + 1;


      var grade;

      if (score == 3)
        grade = "Excellent!";

      else if (score == 2)
        grade = "Very Good";

      else if (score == 1)
        grade = "Good";

      else
        grade = "Try Again";


      var out =
        document.getElementById("out");

      out.classList.remove("d-none");

      out.innerText =
        `Your score: ${score} / 3 — ${grade}`;

    };

  </script>

</body>
</html>
