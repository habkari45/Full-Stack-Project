<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>compute_BMI</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-4" style="max-width: 480px;">

 <a href="../index.html" class="mb-3 d-inline-block">← Back</a>

    <h2>compute_BMI</h2>

    <div class="mb-3">
      <label class="form-label">Patient name</label>
      <input id="name" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Weight (kg)</label>
      <input id="weight" type="number" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Height (cm)</label>
      <input id="height" type="number" class="form-control">
    </div>

    <button id="btn" class="btn btn-primary">
      Compute BMI
    </button>

    <div id="out" class="alert alert-info mt-3 d-none"></div>

  </div>


  <script>

    document.getElementById("btn").onclick = function () {

      var name = document.getElementById("name").value;
      var weight = Number(document.getElementById("weight").value);
      var height = Number(document.getElementById("height").value);

      var heightMeter = height / 100;

      var bmi = weight / (heightMeter * heightMeter);

      var status;

      if (bmi < 18.5)
        status = "Underweight";

      else if (bmi < 25)
        status = "Normal Weight";

      else if (bmi < 30)
        status = "Overweight";

      else
        status = "Obese";

      var out = document.getElementById("out");

      out.classList.remove("d-none");

      out.innerText =
        `${name}: ${bmi.toFixed(2)} — ${status}`;

    };

  </script>

</body>
</html>
