<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Calc</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-4" style="max-width: 480px;">

  <a href="../index.html" class="mb-3 d-inline-block">← Back</a>

    <h2>Calc</h2>

    <p class="text-secondary">+ &nbsp; - &nbsp; * &nbsp; /</p>

    <div class="mb-3">
      <label class="form-label">Number 1</label>
      <input id="num1" type="number" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Number 2</label>
      <input id="num2" type="number" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Operator</label>

      <select id="operator" class="form-select">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>

    </div>

    <button id="btn" class="btn btn-primary">
      Calculate
    </button>

    <div id="out" class="alert alert-info mt-3 d-none"></div>

  </div>


  <script>

    document.getElementById("btn").onclick = function () {

      var num1 =
        Number(document.getElementById("num1").value);

      var num2 =
        Number(document.getElementById("num2").value);

      var operator =
        document.getElementById("operator").value;


      var result;


      if (operator == "+")
        result = num1 + num2;

      else if (operator == "-")
        result = num1 - num2;

      else if (operator == "*")
        result = num1 * num2;

      else if (operator == "/")
        result = num1 / num2;


      var out =
        document.getElementById("out");

      out.classList.remove("d-none");

      out.innerText =
        `${num1} ${operator} ${num2} = ${result}`;

    };

  </script>

</body>
</html>
